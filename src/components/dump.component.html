<tag-element
  [attr.tag]="dumpTagId"
  [attr.propsJson]="({
    key: key,
    value: value,
    show: show,
    showKids: showKids,
    showLevels: showLevels,
    showAll: showAll,
    format: format,
    isRootDump: isRootDump
  }) | json"

  events="formatChange"
  (formatChange)="formatChange.emit($event.detail.formatChange)"
></tag-element>
